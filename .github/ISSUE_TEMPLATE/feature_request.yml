name: Feature request
description: Suggest an idea for RxDev Man
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should be built?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope check
      description: Does this fit the project's single-author, content-first shape? See the Out of Scope section in docs/ROADMAP.md.
      options:
        - Yes, it fits the project's shape
        - Maybe - I'd like a discussion
        - I'm not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else have you tried or considered?
